function renderCompanies() {
  const container = document.getElementById('companyList');
  const searchVal = document.getElementById('search').value.toLowerCase();
  const sevFilter = document.getElementById('severityFilter').value;
  const hideRemoved = document.getElementById('hideRemovedBtn').classList.contains('active');
  const sevKeyMap = { '严重':'critical', '高危':'high', '中危':'medium', '低危':'low' };

  let totalVisible = 0;

  container.innerHTML = companies.map(c => {
    const targetSev = sevKeyMap[sevFilter] || null;

    // Filter valid reports
    let filteredReports = c.reports;
    if (targetSev) filteredReports = filteredReports.filter(r => r.severity === targetSev);
    if (searchVal) filteredReports = filteredReports.filter(r => r.name.toLowerCase().includes(searchVal));

    // Filter removed reports
    let filteredRemoved = c.removedReports;
    if (targetSev) filteredRemoved = filteredRemoved.filter(r => r.severity === targetSev);
    if (searchVal) filteredRemoved = filteredRemoved.filter(r => r.name.toLowerCase().includes(searchVal));
    if (hideRemoved) filteredRemoved = [];

    const hasAny = filteredReports.length > 0 || filteredRemoved.length > 0;

    // Compute per-severity counts for valid reports
    const sevCounts = {};
    filteredReports.forEach(r => { sevCounts[r.severity] = (sevCounts[r.severity] || 0) + 1; });

    if (!hasAny) return '';
    totalVisible++;

    return `
<div class="company-card">
  <div class="company-header" onclick="this.nextElementSibling.classList.toggle('open')">
    <div>
      <span class="name">${escapeHtml(c.name)}</span>
      <span class="badge badge-total">${filteredReports.length} 报告</span>
      ${targetSev ? `<span class="badge badge-filtered">${sevFilter}</span>` : ''}
      ${!hideRemoved && c.removed > 0 ? `<span class="badge badge-removed">${c.removed} 已移除</span>` : ''}
      <div class="severity-summary" style="margin-top:6px">
        ${Object.entries({critical:'严重',high:'高危',medium:'中危',low:'低危'}).map(([k,v]) =>
          sevCounts[k] ? `<span class="sev-${k}">${v}:${sevCounts[k]}</span>` : ''
        ).filter(Boolean).join(' · ') || '<span style="color:#999">该等级无报告</span>'}
      </div>
    </div>
    <span style="color:#999;font-size:20px">▸</span>
  </div>
  <div class="company-body">
    ${c.vulnType ? `<div class="vulntype-info"><strong>漏洞类型要求：</strong>${c.vulnType}</div>` : ''}
    ${filteredReports.length > 0 ? `
    <table class="report-table">
      <tr><th style="width:60px">等级</th><th>报告名称</th><th style="width:160px">链接</th></tr>
      ${filteredReports.map(r => `
      <tr>
        <td><span class="sev-tag ${r.severity}">${r.sevLabel}</span></td>
        <td>${escapeHtml(r.name)}</td>
        <td class="links">
          <a href="${r.md}" target="_blank">📄 MD</a>
          <a href="${r.html}" target="_blank" class="html-link">🌐 HTML</a>
        </td>
      </tr>`).join('')}
    </table>` : '<div style="padding:12px 0;color:#999;">该筛选条件下无有效报告</div>'}
    ${filteredRemoved.length > 0 ? `
    <div style="margin-top:12px;padding:10px 14px;background:#fff0f0;border-radius:6px;border:1px solid #ffcdd2">
      <strong style="color:#c62828;">已移除报告 (${filteredRemoved.length})</strong>
      ${filteredRemoved.map(r => `<div style="margin-top:6px;font-size:13px;color:#666;">❌ ${escapeHtml(r.name)} — ${r.reason}</div>`).join('')}
    </div>` : ''}
  </div>
</div>`;
  }).join('');

  // Show/hide filter hint
  const hint = document.getElementById('filterHint');
  if (sevFilter) {
    hint.textContent = `当前筛选: ${sevFilter} (${totalVisible}家公司有该等级报告)`;
    hint.classList.add('show');
  } else {
    hint.classList.remove('show');
  }
}

function filterReports() { renderCompanies(); }
function expandAll() { document.querySelectorAll('.company-body').forEach(e => e.classList.add('open')); }
function collapseAll() { document.querySelectorAll('.company-body').forEach(e => e.classList.remove('open')); }
function toggleRemoved() {
  document.getElementById('hideRemovedBtn').classList.toggle('active');
  const btn = document.getElementById('hideRemovedBtn');
  if (btn.classList.contains('active')) {
    btn.textContent = '● 隐藏已移除';
  } else {
    btn.textContent = '○ 显示已移除';
  }
  filterReports();
}
